[build]
  publish = "."
  command = "echo 'CTI Global Dashboard pronto para publicacao'"

[build.environment]
  NODE_VERSION = "20"
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
